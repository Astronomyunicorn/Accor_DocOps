repos:
  # Local hooks (custom validation scripts)
  - repo: local
    hooks:
      - id: validate-tags
        name: Validate documentation tags
        entry: python tools/validate_tags.py
        language: system
        files: '^docs/.*\.md$'
        pass_filenames: true

      - id: docs-health-check
        name: Documentation health check
        entry: python tools/docs_health_check.py
        language: system
        files: '^docs/.*\.md$'
        pass_filenames: false

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies: [mdformat-gfm]
        files: '^docs/.*\.md$'
        args: [--wrap=120]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: [--fix]
        files: '^docs/.*\.md$'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: '\.(ya?ml)$'

  # Vale style checking
  - repo: https://github.com/errata-ai/vale
    rev: v3.0.11
    hooks:
      - id: vale
        files: '^docs/.*\.md$'
