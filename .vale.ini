StylesPath = .vale/styles

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale, Microsoft, write-good

# Custom rules for documentation
[*.md]
# Check for passive voice
write-good.passive = YES
# Check for weasel words
write-good.weasel = YES
# Check for adverbs
write-good.adverb = YES
# Check for clichés
write-good.cliche = YES
# Check for too complex sentences
write-good.complex = YES
# Check for hidden verbs
write-good.hidden-verbs = YES
# Check for jargon
write-good.jargon = YES
# Check for duplicate words
write-good.duplicates = YES

# Microsoft style guide rules
Microsoft.Contractions = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.Spelling = YES

# Vale core rules
Vale.Spelling = YES
Vale.Repetition = YES
