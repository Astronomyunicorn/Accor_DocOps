# Vale configuration for Accor DocOps
# See docs/en/devops/vale-setup.md for setup instructions

StylesPath = .vale/styles

MinAlertLevel = suggestion

[*.md]
# Using Vale core styles only (Microsoft and write-good require manual installation)
# Run 'vale sync' to download external styles, or use minimal setup with Vale core only
BasedOnStyles = Vale

# Vale core rules
Vale.Spelling = YES
Vale.Repetition = YES

# Optional: Uncomment below if you install Microsoft and write-good styles
# [*.md]
# BasedOnStyles = Vale, Microsoft, write-good
# 
# # write-good rules
# write-good.passive = YES
# write-good.weasel = YES
# write-good.adverb = YES
# write-good.cliche = YES
# write-good.complex = YES
# write-good.hidden-verbs = YES
# write-good.jargon = YES
# write-good.duplicates = YES
# 
# # Microsoft style guide rules
# Microsoft.Contractions = NO
# Microsoft.FirstPerson = NO
# Microsoft.We = NO
# Microsoft.Spelling = YES
